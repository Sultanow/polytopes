server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Subpath ohne Slash normalisieren; Host bleibt unverändert.
    location = /polytope5d {
        return 308 /polytope5d/;
    }

    # Gleicher Vite-Build kann am Domain-Root UND unter /polytope5d/ laufen.
    # Der Browser bekommt relative Asset-URLs (vite.config.js: base './').
    location ^~ /polytope5d/ {
        rewrite ^/polytope5d/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
