name: polytope5d

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polytope5d-web
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - n8n-net
      - app-net
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-net"

      # Hauptadresse: https://polytope5d.mathematics.art/
      - "traefik.http.routers.polytope5d-subdomain.rule=Host(`polytope5d.mathematics.art`)"
      - "traefik.http.routers.polytope5d-subdomain.entrypoints=websecure"
      - "traefik.http.routers.polytope5d-subdomain.tls=true"
      - "traefik.http.routers.polytope5d-subdomain.tls.certresolver=letsencrypt"
      - "traefik.http.routers.polytope5d-subdomain.service=polytope5d"

      # New multi-dimensional atlas: https://polytopes.mathematics.art/
      - "traefik.http.routers.polytopes-atlas.rule=Host(`polytopes.mathematics.art`)"
      - "traefik.http.routers.polytopes-atlas.entrypoints=websecure"
      - "traefik.http.routers.polytopes-atlas.tls=true"
      - "traefik.http.routers.polytopes-atlas.tls.certresolver=letsencrypt"
      - "traefik.http.routers.polytopes-atlas.service=polytope5d"

      - "traefik.http.routers.polytopes-atlas-http.rule=Host(`polytopes.mathematics.art`)"
      - "traefik.http.routers.polytopes-atlas-http.entrypoints=web"
      - "traefik.http.routers.polytopes-atlas-http.middlewares=polytope5d-https"
      - "traefik.http.routers.polytopes-atlas-http.service=polytope5d"

      # mathematics.art homepage only — do not capture other apex-host paths.
      - "traefik.http.routers.mathematics-home.rule=Host(`mathematics.art`) && Path(`/`)"
      - "traefik.http.routers.mathematics-home.entrypoints=websecure"
      - "traefik.http.routers.mathematics-home.tls=true"
      - "traefik.http.routers.mathematics-home.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mathematics-home.priority=1000"
      - "traefik.http.routers.mathematics-home.service=polytope5d"

      - "traefik.http.routers.mathematics-home-http.rule=Host(`mathematics.art`) && Path(`/`)"
      - "traefik.http.routers.mathematics-home-http.entrypoints=web"
      - "traefik.http.routers.mathematics-home-http.priority=1000"
      - "traefik.http.routers.mathematics-home-http.middlewares=polytope5d-https"
      - "traefik.http.routers.mathematics-home-http.service=polytope5d"

      # Optional vanity URL redirects to the atlas using Nginx.
      - "traefik.http.routers.mathematics-polytopes-link.rule=Host(`mathematics.art`) && (Path(`/polytopes`) || PathPrefix(`/polytopes/`))"
      - "traefik.http.routers.mathematics-polytopes-link.entrypoints=websecure"
      - "traefik.http.routers.mathematics-polytopes-link.tls=true"
      - "traefik.http.routers.mathematics-polytopes-link.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mathematics-polytopes-link.priority=1200"
      - "traefik.http.routers.mathematics-polytopes-link.service=polytope5d"

      - "traefik.http.routers.mathematics-polytopes-http.rule=Host(`mathematics.art`) && (Path(`/polytopes`) || PathPrefix(`/polytopes/`))"
      - "traefik.http.routers.mathematics-polytopes-http.entrypoints=web"
      - "traefik.http.routers.mathematics-polytopes-http.priority=1200"
      - "traefik.http.routers.mathematics-polytopes-http.middlewares=polytope5d-https"
      - "traefik.http.routers.mathematics-polytopes-http.service=polytope5d"

      # Zweite Adresse: https://mathematics.art/polytope5d/
      # Achtung: Wildcard-DNS *.mathematics.art deckt den Apex mathematics.art NICHT ab.
      - "traefik.http.routers.polytope5d-path.rule=Host(`mathematics.art`) && (Path(`/polytope5d`) || PathPrefix(`/polytope5d/`))"
      - "traefik.http.routers.polytope5d-path.entrypoints=websecure"
      - "traefik.http.routers.polytope5d-path.tls=true"
      - "traefik.http.routers.polytope5d-path.tls.certresolver=letsencrypt"
      - "traefik.http.routers.polytope5d-path.priority=2000"
      - "traefik.http.routers.polytope5d-path.service=polytope5d"

      # Nur die eigenen URLs von HTTP auf HTTPS umleiten.
      - "traefik.http.routers.polytope5d-http.rule=Host(`polytope5d.mathematics.art`) || (Host(`mathematics.art`) && (Path(`/polytope5d`) || PathPrefix(`/polytope5d/`)))"
      - "traefik.http.routers.polytope5d-http.entrypoints=web"
      - "traefik.http.routers.polytope5d-http.priority=2000"
      - "traefik.http.routers.polytope5d-http.middlewares=polytope5d-https"
      - "traefik.http.routers.polytope5d-http.service=polytope5d"
      - "traefik.http.middlewares.polytope5d-https.redirectscheme.scheme=https"

      - "traefik.http.services.polytope5d.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ./api
    container_name: polytope5d-api
    restart: unless-stopped
    environment:
      POLYTOPE_DB: /data/polytopes.sqlite3
    volumes:
      - polytope5d-index:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  n8n-net:
    external: true
  app-net:
    internal: true

volumes:
  polytope5d-index:
